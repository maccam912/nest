<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>nest</title>
    <link data-trunk rel="rust" data-wasm-opt="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1e1e1e;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #aaa;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading nest…</div>
    <canvas id="nest_canvas"></canvas>
    <script>
      // Hide the loading text once the wasm app has had a moment to start.
      window.addEventListener("load", () => {
        setTimeout(() => {
          const el = document.getElementById("loading");
          if (el) el.remove();
        }, 1500);
      });
    </script>
  </body>
</html>
